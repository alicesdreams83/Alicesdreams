<section class="portfolio_Section">

    <div class="portfolio_Intro">

        <h1>My Portfolio</h1>

        <p>
            Choose a category to explore my creative work.
        </p>

    </div>


    <div class="portfolio_Categories">

        <!-- Graphic Design -->

        <div class="portfolio_Item">

            <button
                class="portfolio_Star"
                type="button"
                data-category="graphic-design"
                aria-label="Open Graphic Design portfolio"
                aria-expanded="false"
            >
                <span class="star_Visual" aria-hidden="true">

                    <span class="star_Half star_Left">
                        ★
                    </span>

                    <span class="star_Half star_Right">
                        ★
                    </span>

                </span>

                <span class="star_Label">
                    Graphic Design
                </span>
            </button>


            <div class="portfolio_Filmstrip">

                <div class="filmstrip_Track">

                    <article class="portfolio_Card">

                        <div class="card_Image">
                            <img
                                src="project_test.png"
                                alt="Preview of Project One"
                            >
                        </div>

                        <h2>Project One</h2>

                    </article>


                    <article class="portfolio_Card">

                        <div class="card_Image">
                            Image 2
                        </div>

                        <h2>Project Two</h2>

                    </article>


                    <article class="portfolio_Card">

                        <div class="card_Image">
                            Image 3
                        </div>

                        <h2>Project Three</h2>

                    </article>

                </div>

            </div>

        </div>


        <!-- Illustrations -->

        <div class="portfolio_Item">

            <button
                class="portfolio_Star"
                type="button"
                data-category="illustrations"
                aria-label="Open Illustrations portfolio"
                aria-expanded="false"
            >
                <span class="star_Visual" aria-hidden="true">

                    <span class="star_Half star_Left">
                        ★
                    </span>

                    <span class="star_Half star_Right">
                        ★
                    </span>

                </span>

                <span class="star_Label">
                    Illustrations
                </span>
            </button>


            <div class="portfolio_Filmstrip">

                <div class="filmstrip_Track">

                    <article class="portfolio_Card">

                        <div class="card_Image">
                            Character Concept
                        </div>

                        <h2>Character Art</h2>

                    </article>


                    <article class="portfolio_Card">

                        <div class="card_Image">
                            Scenery
                        </div>

                        <h2>Scenery</h2>

                    </article>


                    <article class="portfolio_Card">

                        <div class="card_Image">
                            Creatures
                        </div>

                        <h2>Creature Designs</h2>

                    </article>

                </div>

            </div>

        </div>

    </div>

</section>
