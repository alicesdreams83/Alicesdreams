<section class="portfolio_Section">

    <div class="portfolio_Intro">

        <h1>My Portfolio</h1>

        <p>
            Choose a category to explore my creative work.
        </p>

    </div>


    <div class="portfolio_Categories">

        <!-- Graphic Design -->

        <div class="portfolio_Item">

            <button
                class="portfolio_Star"
                type="button"
                data-category="graphic-design"
                aria-label="Open Graphic Design portfolio"
                aria-expanded="false"
            >
                <span
    class="star_Visual"
    data-symbol="★"
    aria-hidden="true"
>

                    <span class="star_Half star_Left">
                        ★
                    </span>

                    <span class="star_Half star_Right">
                        ★
                    </span>

                </span>

                <span class="star_Label">
                    Graphic Design
                </span>
            </button>


            <div class="portfolio_Filmstrip">

                <div class="filmstrip_Track">

                    <button
    class="portfolio_Card media_Card"
    type="button"
    data-media-type="image"
    data-media-src="project_test.png"
    data-category="Graphic Design"
>
    <span class="card_Image">

        <img
            src="project_test.png"
            alt="Preview of Project One"
        >

    </span>

    <span class="card_Title">
        Project One
    </span>

    <span
        class="card_Description"
        hidden
    >
        Write your project description here.

        You can explain what the project was,
        what programs or materials you used,
        what inspired the design, and any
        interesting challenges you solved.
    </span>

</button>


                    <button
    class="portfolio_Card media_Card"
    type="button"
    data-media-type="image"
    data-media-src="project_test.png"
    data-category="Graphic Design"
>
    <span class="card_Image">

        <img
            src="project_test.png"
            alt="Preview of Project Two"
        >

    </span>

    <span class="card_Title">
        Project Two
    </span>

    <span
        class="card_Description"
        hidden
    >
        This is the description for Project Two.

        Each portfolio card can have its own
        title, category, image, and written
        explanation inside the large viewer.
    </span>

</button>


                    <article class="portfolio_Card">

                        <div class="card_Image">
                            Image 3
                        </div>

                        <h2>Project Three</h2>

                    </article>

                </div>

            </div>

        </div>


        <!-- Illustrations -->

        <div class="portfolio_Item">

            <button
                class="portfolio_Star"
                type="button"
                data-category="illustrations"
                aria-label="Open Illustrations portfolio"
                aria-expanded="false"
            >
                <span
    class="star_Visual"
    data-symbol="✦"
    aria-hidden="true"
>

                    <span class="star_Half star_Left">
                        ✦
                    </span>

                    <span class="star_Half star_Right">
                        ✦
                    </span>

                </span>

                <span class="star_Label">
                    Illustrations
                </span>
            </button>


            <div class="portfolio_Filmstrip">

                <div class="filmstrip_Track">

                    <button
    class="portfolio_Card media_Card"
    type="button"
    data-media-type="image"
    data-media-src="project_test.png"
    data-category="Illustrations"
>
    <span class="card_Image">

        <img
            src="project_test.png"
            alt="Preview of Character Art"
        >

    </span>

    <span class="card_Title">
        Character Art
    </span>

    <span
        class="card_Description"
        hidden
    >
        Write the description for this
        illustration project here.

        You can discuss the character,
        concept, drawing process, materials,
        software, or inspiration.
    </span>

</button>


                    <button
    class="portfolio_Card media_Card"
    type="button"
    data-media-type="image"
    data-media-src="project_test.png"
    data-category="Illustrations"
>
    <span class="card_Image">

        <img
            src="project_test.png"
            alt="Preview of Scenery illustration"
        >

    </span>

    <span class="card_Title">
        Scenery
    </span>

    <span
        class="card_Description"
        hidden
    >
        Write the description for this
        scenery illustration here.

        You can describe the setting,
        atmosphere, colors, composition,
        inspiration, and drawing process.
    </span>

</button>

                    <button
    class="portfolio_Card media_Card"
    type="button"
    data-media-type="image"
    data-media-src="project_test.png"
    data-category="Illustrations"
>
    <span class="card_Image">

        <img
            src="project_test.png"
            alt="Preview of Creature Designs"
        >

    </span>

    <span class="card_Title">
        Creature Designs
    </span>

    <span
        class="card_Description"
        hidden
    >
        Write the description for these
        creature designs here.

        You can discuss the concept,
        anatomy, personality, inspiration,
        colors, and illustration process.
    </span>

</button>

                </div>

            </div>

        </div>

    </div>

</section>

<dialog
    class="media_Viewer"
    id="media_Viewer"
    aria-labelledby="media_Viewer_Title"
>
    <div class="viewer_Shell">

        <button
            class="viewer_Close"
            id="viewer_Close"
            type="button"
            aria-label="Close project viewer"
        >
            ×
        </button>


        <div
            class="viewer_Media"
            id="viewer_Media"
        ></div>


        <aside class="viewer_Info">

            <p
                class="viewer_Category"
                id="viewer_Category"
            ></p>

            <h2 id="media_Viewer_Title">
                Project Title
            </h2>

            <div
                class="viewer_Description"
                id="viewer_Description"
            ></div>

        </aside>

    </div>
</dialog>
